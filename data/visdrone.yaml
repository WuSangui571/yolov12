# VisDrone2019-DET dataset configuration for YOLOv12.
# Ultralytics resolves non-absolute paths under its internal datasets directory,
# so "../VisDrone2019" points back to the repo root on both Windows and Linux.

path: ../VisDrone2019
train: VisDrone2019-DET-train/images
val: VisDrone2019-DET-val/images
test: VisDrone2019-DET-test-dev/images

nc: 10
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
